---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  tests:
    name: PHP ${{ matrix.php-version }} - ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          php-version: ${{ matrix.php-version }}
      - name: Display PHP and Composer versions
        run: |
          php --version
          composer --version

      - if: matrix.dependencies == 'lowest'
        name: Install lowest compatible dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
      - if: matrix.dependencies == 'highest'
        name: Install highest compatible dependencies
        run: composer update --prefer-stable --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit tests
        run: vendor/bin/phpunit
    strategy:
      fail-fast: false
      matrix:
        dependencies: ['lowest', 'highest']
        php-version: ['8.4.1', '8.5']
    timeout-minutes: 10
name: PHPUnit Tests
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read